<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top Up FC Mobile</title>
    <link rel="stylesheet" href="checkout.css" />
  </head>
  <body>
    <div class="checkout-container">
      <h1>Top Up FC Mobile</h1>
      <form class="checkout-form">
        <!-- Informasi Akun -->
        <div class="form-section">
          <h2>Informasi Akun</h2>
          <label>Username</label>
          <input
            type="text"
            name="username"
            placeholder="Masukkan Username FC Mobile"
            required
          />

          <label>Platform (opsional)</label>
          <input
            type="text"
            name="platform"
            placeholder="Contoh: Android, iOS"
          />
        </div>

        <!-- Pilih FC Points -->
        <div class="form-section">
          <h2>Pilih Jumlah FC Points</h2>

          <div class="item">
            <label>
              <input
                type="radio"
                name="fcpoints"
                class="fcpoints-option"
                data-price="12000"
                value="100"
                checked
              />
              100 FC Points - Rp12.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="fcpoints"
                class="fcpoints-option"
                data-price="35000"
                value="300"
              />
              300 FC Points - Rp35.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="fcpoints"
                class="fcpoints-option"
                data-price="60000"
                value="600"
              />
              600 FC Points - Rp60.000
            </label>
          </div>
        </div>

        <!-- Metode Pembayaran -->
        <div class="form-section">
          <h2>Metode Pembayaran</h2>
          <select name="pembayaran" required>
            <option value="">Pilih Metode Pembayaran</option>
            <option value="dana">DANA</option>
            <option value="ovo">OVO</option>
            <option value="gopay">GoPay</option>
            <option value="qris">QRIS</option>
          </select>
        </div>

        <!-- Ringkasan -->
        <div class="order-summary">
          <h2>Ringkasan Pembelian</h2>
          <p>FC Points: <span id="jumlahFCPoints">100</span></p>
          <p class="total">Total: <span id="totalHarga">Rp12.000</span></p>
        </div>

        <button type="submit" class="checkout-button">Bayar Sekarang</button>
      </form>
    </div>

    <script src="checkout.js"></script>
  </body>
</html>
