<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top Up Call of Duty Mobile</title>
    <link rel="stylesheet" href="checkout.css" />
  </head>
  <body>
    <div class="checkout-container">
      <h1>Top Up Call of Duty Mobile</h1>
      <form class="checkout-form">
        <!-- Informasi Akun -->
        <div class="form-section">
          <h2>Informasi Akun</h2>
          <label>COD ID</label>
          <input
            type="text"
            name="cod_id"
            placeholder="Masukkan Call of Duty ID"
            required
          />

          <label>Region (opsional)</label>
          <input type="text" name="region" placeholder="Contoh: Asia, NA, EU" />
        </div>

        <!-- Pilih CP -->
        <div class="form-section">
          <h2>Pilih Jumlah CP</h2>

          <div class="item">
            <label>
              <input
                type="radio"
                name="cp"
                class="cp-option"
                data-price="14000"
                value="60"
                checked
              />
              60 CP - Rp14.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="cp"
                class="cp-option"
                data-price="34000"
                value="180"
              />
              180 CP - Rp34.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="cp"
                class="cp-option"
                data-price="55000"
                value="325"
              />
              325 CP - Rp55.000
            </label>
          </div>
        </div>

        <!-- Metode Pembayaran -->
        <div class="form-section">
          <h2>Metode Pembayaran</h2>
          <select name="pembayaran" required>
            <option value="">Pilih Metode Pembayaran</option>
            <option value="dana">DANA</option>
            <option value="ovo">OVO</option>
            <option value="gopay">GoPay</option>
            <option value="qris">QRIS</option>
          </select>
        </div>

        <!-- Ringkasan -->
        <div class="order-summary">
          <h2>Ringkasan Pembelian</h2>
          <p>CP: <span id="jumlahCP">60</span></p>
          <p class="total">Total: <span id="totalHarga">Rp14.000</span></p>
        </div>

        <button type="submit" class="checkout-button">Bayar Sekarang</button>
      </form>
    </div>

    <script src="checkout.js"></script>
  </body>
</html>
