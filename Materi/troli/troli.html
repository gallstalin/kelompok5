<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Up</title>
    <link rel="stylesheet" href="troli.css" />
  </head>
  <body>
    <div class="topup-container">
      <h2>Top Up</h2>
      <form id="topup-form">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" required />

        <label for="id_pengguna">ID Pengguna:</label>
        <input type="text" id="id_pengguna" name="id_pengguna" required />

        <label for="nominal">Nominal Top Up mobile legends:</label>
        <select id="nominal" name="nominal" required>
          <option value="">Pilih Nominal</option>
          <option value="10000">70 Diamond=Rp 10.000</option>
          <option value="20000">150 Diamond=Rp 20.000</option>
          <option value="50000">256 Diamond=Rp 50.000</option>
          <option value="100000">350 Diamond=Rp 100.000</option>
        </select>

        <label for="pembayaran">Metode Pembayaran:</label>
        <select id="pembayaran" name="pembayaran" required>
          <option value="">Pilih Metode</option>
          <option value="gopay">GoPay</option>
          <option value="ovo">OVO</option>
          <option value="dana">DANA</option>
          <option value="transfer">Transfer Bank</option>
        </select>

        <button type="submit">Kirim</button>
      </form>
    </div>
  </body>
</html>
