<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top Up Stumble Guys</title>
    <link rel="stylesheet" href="checkout.css" />
  </head>
  <body>
    <div class="checkout-container">
      <h1>Top Up Stumble Guys</h1>
      <form class="checkout-form">
        <!-- Informasi Akun -->
        <div class="form-section">
          <h2>Informasi Akun</h2>
          <label>Username</label>
          <input
            type="text"
            name="username"
            placeholder="Masukkan Username Stumble Guys"
            required
          />

          <label>Platform (opsional)</label>
          <input
            type="text"
            name="platform"
            placeholder="Contoh: Android, iOS, Steam"
          />
        </div>

        <!-- Pilih Crowns -->
        <div class="form-section">
          <h2>Pilih Jumlah Crowns</h2>

          <div class="item">
            <label>
              <input
                type="radio"
                name="crowns"
                class="crowns-option"
                data-price="10000"
                value="100"
                checked
              />
              100 Crowns - Rp10.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="crowns"
                class="crowns-option"
                data-price="28000"
                value="300"
              />
              300 Crowns - Rp28.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="crowns"
                class="crowns-option"
                data-price="45000"
                value="500"
              />
              500 Crowns - Rp45.000
            </label>
          </div>
        </div>

        <!-- Metode Pembayaran -->
        <div class="form-section">
          <h2>Metode Pembayaran</h2>
          <select name="pembayaran" required>
            <option value="">Pilih Metode Pembayaran</option>
            <option value="dana">DANA</option>
            <option value="ovo">OVO</option>
            <option value="gopay">GoPay</option>
            <option value="qris">QRIS</option>
          </select>
        </div>

        <!-- Ringkasan -->
        <div class="order-summary">
          <h2>Ringkasan Pembelian</h2>
          <p>Crowns: <span id="jumlahCrowns">100</span></p>
          <p class="total">Total: <span id="totalHarga">Rp10.000</span></p>
        </div>

        <button type="submit" class="checkout-button">Bayar Sekarang</button>
      </form>
    </div>

    <script src="checkout.js"></script>
  </body>
</html>
