<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Judul || Masuk</title>
    <link rel="stylesheet" href="../Authentication-Form/Sign-in.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link href="Sign-up.css" rel="stylesheet" />
  </head>
  <body>
    <div class="background"></div>
    <div
      class="card"
      data-aos="fade-up"
      data-aos-delay="1000"
      data-aos-duration="600"
    >
      <img class="logo" src="../Assets/x1.png" />
      <h2>Daftar</h2>
      <h3>XiON Top-up </h3>
      <form class="form" id="signin-form" onsubmit="return validateForm()">
        <div class="textbox">
          <span class="material-symbols-outlined"> account_circle </span>
          <input type="email" id="email" placeholder="Email" required />
        </div>
        <div class="textbox">
          <span class="material-symbols-outlined"> lock </span>
          <input type="password" id="password" placeholder="Kata Sandi" required />
        </div>
        <button type="submit">Masuk</button>
      </form>
      <a href="#">Forgot Password?</a>
      <footer>
        Sudah Memiliki Akun?Sign-in
        <a href="../Authentication-Form/Sign-in.html">Click Here</a>
      </footer>
    </div>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init();

      // Fungsi validasi form
      function validateForm() {
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;

        // Cek jika email atau password kosong
        if (email === '' || password === '') {
          alert('Harap isi kolom email dan kata sandi.');
          return false; // Mencegah pengiriman form jika kolom kosong
        }
        return true; // Izinkan pengiriman form jika validasi berhasil
      }
    </script>
  </body>
</html>
