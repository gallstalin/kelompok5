<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top Up Honor of Kings</title>
    <link rel="stylesheet" href="checkout.css" />
  </head>
  <body>
    <div class="checkout-container">
      <h1>Top Up Honor of Kings</h1>
      <form class="checkout-form">
        <!-- Informasi Akun -->
        <div class="form-section">
          <h2>Informasi Akun</h2>
          <label>ID Pemain</label>
          <input
            type="text"
            name="user_id"
            placeholder="Masukkan ID Honor of Kings"
            required
          />

          <label>Server (opsional)</label>
          <input type="text" name="server" placeholder="Contoh: Asia, Global" />
        </div>

        <!-- Pilih Tokens -->
        <div class="form-section">
          <h2>Pilih Jumlah Tokens</h2>

          <div class="item">
            <label>
              <input
                type="radio"
                name="tokens"
                class="tokens-option"
                data-price="15000"
                value="100"
                checked
              />
              100 Tokens - Rp15.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="tokens"
                class="tokens-option"
                data-price="36000"
                value="310"
              />
              310 Tokens - Rp36.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="tokens"
                class="tokens-option"
                data-price="58000"
                value="520"
              />
              520 Tokens - Rp58.000
            </label>
          </div>
        </div>

        <!-- Metode Pembayaran -->
        <div class="form-section">
          <h2>Metode Pembayaran</h2>
          <select name="pembayaran" required>
            <option value="">Pilih Metode Pembayaran</option>
            <option value="dana">DANA</option>
            <option value="ovo">OVO</option>
            <option value="gopay">GoPay</option>
            <option value="qris">QRIS</option>
          </select>
        </div>

        <!-- Ringkasan -->
        <div class="order-summary">
          <h2>Ringkasan Pembelian</h2>
          <p>Tokens: <span id="jumlahTokens">100</span></p>
          <p class="total">Total: <span id="totalHarga">Rp15.000</span></p>
        </div>

        <button type="submit" class="checkout-button">Bayar Sekarang</button>
      </form>
    </div>

    <script src="checkout.js"></script>
  </body>
</html>
