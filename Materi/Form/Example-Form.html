<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <li class="game-id">ID Game:</li>
      <input type="text" id="game-id" name="game-id" required />
      <li class="jumlah">Jumlah Diamond:</li>
      <select id="jumlah" name="jumlah">
        <option value="50">50 Diamond</option>
        <option value="100">100 Diamond</option>
      </select>
      <li for="pembayaran">Metode Pembayaran:</li>
      <select id="pembayaran" name="pembayaran">
        <option value="dana">DANA</option>
        <option value="gopay">GoPay</option>
      </select>
      <button type="submit">Beli Sekarang</button>
    </form>
  </body>
</html>
