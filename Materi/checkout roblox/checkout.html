<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top Up Roblox</title>
    <link rel="stylesheet" href="checkout.css" />
  </head>
  <body>
    <div class="checkout-container">
      <h1>Top Up Roblox - Voucher</h1>
      <form class="checkout-form">
        <!-- Informasi Akun -->
        <div class="form-section">
          <h2>Informasi Akun</h2>
          <label>Email</label>
          <input
            type="text"
            name="user_id"
            placeholder="Masukkan Email"
            required
          />
        </div>

        <!-- Pilih Cash Point -->
        <div class="form-section">
          <h2>Pilih Nominal</h2>

          <div class="item">
            <label>
              <input
                type="radio"
                name="cashpoint"
                class="cashpoint-option"
                data-price="150000"
                value="10"
                checked
              />
              Roblox 10 Usd - Rp150.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="cashpoint"
                class="cashpoint-option"
                data-price="250000"
                value="15"
              />
              Roblox 15 Usd - Rp250.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="cashpoint"
                class="cashpoint-option"
                data-price="330000"
                value="20"
              />
              Roblox 20 Usd - Rp330.000
            </label>
          </div>
        </div>

        <!-- Metode Pembayaran -->
        <div class="form-section">
          <h2>Metode Pembayaran</h2>
          <select name="pembayaran" required>
            <option value="">Pilih Metode</option>
            <option value="dana">DANA</option>
            <option value="ovo">OVO</option>
            <option value="gopay">GoPay</option>
            <option value="qris">QRIS</option>
          </select>
        </div>

        <!-- Ringkasan -->
        <div class="order-summary">
          <h2>Ringkasan Pembelian</h2>
          <p>Voucher Roblox: <span id="jumlahCashPoint">10</span></p>
          <p class="total">Total: <span id="totalHarga">Rp150.000</span></p>
        </div>

        <button type="submit" class="checkout-button">Bayar Sekarang</button>
      </form>
    </div>

    <script src="checkout.js"></script>
  </body>
</html>
