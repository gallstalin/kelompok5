<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top Up Point Blank</title>
    <link rel="stylesheet" href="checkout.css" />
  </head>
  <body>
    <div class="checkout-container">
      <h1>Top Up Point Blank</h1>
      <form class="checkout-form">
        <!-- Informasi Akun -->
        <div class="form-section">
          <h2>Informasi Akun</h2>
          <label>ID Pengguna</label>
          <input
            type="text"
            name="user_id"
            placeholder="Masukkan ID Point Blank"
            required
          />

          <label>Server</label>
          <input
            type="text"
            name="server"
            placeholder="Masukkan Server"
            required
          />
        </div>

        <!-- Pilih Cash Point -->
        <div class="form-section">
          <h2>Pilih Jumlah Cash Point</h2>

          <div class="item">
            <label>
              <input
                type="radio"
                name="cashpoint"
                class="cashpoint-option"
                data-price="12000"
                value="100"
                checked
              />
              100 Cash Point - Rp12.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="cashpoint"
                class="cashpoint-option"
                data-price="35000"
                value="300"
              />
              300 Cash Point - Rp35.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="cashpoint"
                class="cashpoint-option"
                data-price="65000"
                value="600"
              />
              600 Cash Point - Rp65.000
            </label>
          </div>
        </div>

        <!-- Metode Pembayaran -->
        <div class="form-section">
          <h2>Metode Pembayaran</h2>
          <select name="pembayaran" required>
            <option value="">Pilih Metode</option>
            <option value="dana">DANA</option>
            <option value="ovo">OVO</option>
            <option value="gopay">GoPay</option>
            <option value="qris">QRIS</option>
          </select>
        </div>

        <!-- Ringkasan -->
        <div class="order-summary">
          <h2>Ringkasan Pembelian</h2>
          <p>Cash Point: <span id="jumlahCashPoint">100</span></p>
          <p class="total">Total: <span id="totalHarga">Rp12.000</span></p>
        </div>

        <button type="submit" class="checkout-button">Bayar Sekarang</button>
      </form>
    </div>

    <script src="checkout.js"></script>
  </body>
</html>
