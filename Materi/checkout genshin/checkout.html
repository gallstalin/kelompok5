<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top Up Genshin Impact</title>
    <link rel="stylesheet" href="checkout.css" />
  </head>
  <body>
    <div class="checkout-container">
      <h1>Top Up Genshin Impact</h1>
      <form class="checkout-form">
        <!-- Informasi Akun -->
        <div class="form-section">
          <h2>Informasi Akun</h2>
          <label>UID Genshin</label>
          <input
            type="text"
            name="user_uid"
            placeholder="Masukkan UID Genshin Impact"
            required
          />
        </div>

        <!-- Pilih Primogems -->
        <div class="form-section">
          <h2>Pilih Jumlah Primogems</h2>

          <div class="item">
            <label>
              <input
                type="radio"
                name="primogems"
                class="primogems-option"
                data-price="167000"
                value="6800"
                checked
              />
              6,800 Primogems - Rp167.000
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="primogems"
                class="primogems-option"
                data-price="83500"
                value="3400"
              />
              3,400 Primogems - Rp83.500
            </label>
          </div>

          <div class="item">
            <label>
              <input
                type="radio"
                name="primogems"
                class="primogems-option"
                data-price="41700"
                value="1700"
              />
              1,700 Primogems - Rp41.700
            </label>
          </div>
        </div>

        <!-- Metode Pembayaran -->
        <div class="form-section">
          <h2>Metode Pembayaran</h2>
          <select name="pembayaran" required>
            <option value="">Pilih Metode</option>
            <option value="dana">DANA</option>
            <option value="ovo">OVO</option>
            <option value="gopay">GoPay</option>
            <option value="qris">QRIS</option>
          </select>
        </div>

        <!-- Ringkasan -->
        <div class="order-summary">
          <h2>Ringkasan Pembelian</h2>
          <p>Primogems: <span id="jumlahPrimogems">6,800</span></p>
          <p class="total">Total: <span id="totalHarga">Rp167.000</span></p>
        </div>

        <button type="submit" class="checkout-button">Bayar Sekarang</button>
      </form>
    </div>

    <script src="checkout.js"></script>
  </body>
</html>
